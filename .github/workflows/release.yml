# [AI修改] 仅在同一提交的所有原生测试和打包通过后创建草稿，绝不自动公开未验收软件。
name: Release candidates
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true
      - name: Verify checksums and prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          for sums in *.sha256; do sha256sum -c "$sums"; done
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          cd ..
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current" = "$GITHUB_SHA" || { echo 'main已有新提交，不创建过时草稿。' >&2; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'tag与VERSION不一致，拒绝发布。' >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # [AI修改] 仅更新本自动化自己的未公开候选草稿；公开版本和既有tag绝不覆盖。
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$tag" --json author --jq .author.login)" = 'github-actions[bot]'
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
            fi
            gh release edit "$tag" --target "$GITHUB_SHA" --notes-file docs/RELEASE_NOTES.md
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --target "$GITHUB_SHA" --draft --prerelease --title "CodeXPedal $tag" --notes-file docs/RELEASE_NOTES.md
          fi
