# [AI修改] 两端共用同一份业务实现；原生界面不依赖 Rust 开发环境。
[package]
name = "codexpedal-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "codexpedal_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde_json = "1.0"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
